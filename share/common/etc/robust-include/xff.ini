[Network]
;; If you have a transparent proxy or proxies, you need to configure them to process http header X-Forwarded-For in a secure way
;; In order for OpenSim to trust them add their addresses (as seen by robust) to this setting
;; You can specify multiple addresses by separating them with a bar
;; Each address can be a hostname (heavier), an IP address or a network range in CIDR format
;; example
XFFTrustedProxies = "127.0.0.0/8|10.0.0.0/8|192.168.0.0/16"
